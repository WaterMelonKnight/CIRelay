[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cirelay-strands-agent"
version = "0.1.0"
description = "Thin Strands Agents adapter for CIRelay"
requires-python = ">=3.11"
dependencies = ["strands-agents==1.19.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.12.12", "mypy==1.17.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cirelay_strands_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "strands"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cirelay_strands_agent.tools"
disable_error_code = ["untyped-decorator"]
